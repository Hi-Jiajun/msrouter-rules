name: build rules

on:
  schedule:
    - cron: '0 20 * * *'   # 北京时间 04:00
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# 钉死版本：不同日期的 .srs 必须能装进同一个客户端，不能今天 1.14 明天 1.15
env:
  TZ: Asia/Shanghai
  SING_BOX_VERSION: v1.14.4
  KEEP_RELEASES: 30

# 串行化同分支构建与 Release 发布，避免 schedule 与轨 2 push 并发踩踏同一 latest 资产
concurrency:
  group: build-rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 发布 release 与清理旧 release 需要
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: 安装 sing-box ${{ env.SING_BOX_VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${SING_BOX_VERSION#v}"
          gh release download "$SING_BOX_VERSION" --repo SagerNet/sing-box \
            --pattern "sing-box-${V}-linux-amd64.tar.gz" --dir /tmp/sb
          tar -xzf /tmp/sb/*.tar.gz -C /tmp/sb
          BIN=$(find /tmp/sb -type f -name sing-box -perm -u+x | head -1)
          echo "SING_BOX=$BIN" >> "$GITHUB_ENV"
          "$BIN" version | head -1

      - name: 构建 + 断言 + 阈值检查
        run: |
          node tools/build.mjs
          node --test

      - name: 上传产物（供排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rules-${{ github.run_id }}
          path: |
            dist/srs/
            dist/geosite.dat
            dist/geoip.dat
            dist/manifest.json
          retention-days: 7

      - name: 原子发布（先 --draft 全量上传再切换 latest，避免半更新窗口）
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STAMP=$(date +%Y%m%d-%H%M%S)
          TAG="rules-$STAMP"
          gh release create "$TAG" dist/srs/*.srs dist/geosite.dat dist/geoip.dat dist/manifest.json \
            --draft \
            --title "rules $STAMP" \
            --notes "sing-box $SING_BOX_VERSION + v2ray geosite.dat/geoip.dat；来源与条目数见 manifest.json"
          gh release edit "$TAG" --draft=false --latest

      - name: 清理旧 release（保留最近 ${{ env.KEEP_RELEASES }} 个）
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[(env.KEEP_RELEASES | tonumber):] | .[].tagName' \
          | while read -r tag; do [ -n "$tag" ] && gh release delete "$tag" --yes --cleanup-tag; done
